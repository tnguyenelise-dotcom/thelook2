cubes:
  - name: inventory_items
    sql_table: public.inventory_items
    public: false
    description: Individual units of inventory purchased for products, tracked from purchase to sale.

    joins:
      - name: products
        sql: "{CUBE}.product_id = {products}.id"
        relationship: many_to_one

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true

      - name: product_id
        sql: product_id
        type: number

      - name: created_at
        sql: created_at
        type: time

      - name: sold_at
        sql: "CAST({CUBE}.sold_at AS TIMESTAMP)"
        type: time

      - name: is_sold
        sql: "CASE WHEN {CUBE}.sold_at IS NOT NULL THEN 'Sold' ELSE 'In Stock' END"
        type: string

      - name: cost
        sql: cost
        type: number

      - name: product_category
        sql: product_category
        type: string

      - name: product_name
        sql: product_name
        type: string

      - name: product_brand
        sql: product_brand
        type: string

      - name: product_retail_price
        sql: product_retail_price
        type: number

      - name: product_department
        sql: product_department
        type: string

      - name: product_sku
        sql: product_sku
        type: string

      - name: product_distribution_center_id
        sql: product_distribution_center_id
        type: number

    measures:
      - name: count
        type: count
        drill_members:
          - id
          - product_name
          - product_category
          - created_at

      - name: sold_count
        type: count
        filters:
          - sql: "{CUBE}.sold_at IS NOT NULL"
        drill_members:
          - product_id
          - product_name
          - product_brand
          - product_category
          - product_department
          - product_distribution_center_id

      - name: total_inventory_cost
        sql: cost
        type: sum
        format: currency
        drill_members:
          - product_id
          - product_name
          - product_brand
          - product_category
          - product_department
          - product_distribution_center_id
