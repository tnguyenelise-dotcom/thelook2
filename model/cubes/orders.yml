cubes:
  - name: orders
    sql_table: public.orders
    public: false
    description: Customer orders (one row per order).

    joins:
      - name: users
        sql: "{CUBE}.user_id = {users}.id"
        relationship: many_to_one

    dimensions:
      - name: order_id
        sql: order_id
        type: number
        primary_key: true

      - name: user_id
        sql: user_id
        type: number

      - name: status
        sql: status
        type: string

      - name: gender
        sql: gender
        type: string

      - name: created_at
        sql: created_at
        type: time

      - name: returned_at
        sql: "CAST({CUBE}.returned_at AS TIMESTAMP)"
        type: time

      - name: shipped_at
        sql: "CAST({CUBE}.shipped_at AS TIMESTAMP)"
        type: time

      - name: delivered_at
        sql: "CAST({CUBE}.delivered_at AS TIMESTAMP)"
        type: time

      - name: num_of_item
        sql: num_of_item
        type: number

    measures:
      - name: count
        type: count
        drill_members:
          - order_id
          - status
          - created_at
          - num_of_item

      - name: total_items
        sql: num_of_item
        type: sum

      - name: avg_items_per_order
        sql: num_of_item
        type: avg

      - name: completed_count
        type: count
        filters:
          - sql: "{CUBE}.status = 'Complete'"
        drill_members:
          - order_id
          - status
          - created_at

      - name: returned_order_count
        title: Returned Order Count
        type: count
        filters:
          - sql: "{CUBE}.status = 'Returned'"
        drill_members:
          - order_id
          - status
          - created_at

      - name: cancelled_count
        type: count
        filters:
          - sql: "{CUBE}.status = 'Cancelled'"
        drill_members:
          - order_id
          - status
          - created_at

      - name: net_orders
        title: "Net Orders"
        description: "All orders minus cancelled and returned orders."
        type: count
        filters:
          - sql: "{CUBE}.status NOT IN ('Cancelled', 'Returned')"
        drill_members:
          - order_id
          - status
          - created_at

